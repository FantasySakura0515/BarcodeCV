system:
  mode: "continuous"              # "single", "continuous", "calibration"
  scan_interval_seconds: 2.0
  save_images: true
  image_output_dir: "./output/images"
  log_level: "INFO"
  log_file: "./logs/barcodecv.log"

cameras:
  global:
    type: "picamera"
    camera_num: 0
    width: 1920
    height: 1080
    role: "detection"
  local:
    type: "picamera"
    camera_num: 1
    width: 1920
    height: 1080
    role: "decoding"

# --- Scanner mode ---
# "nn"      : Neural network pipeline (YOLO detection + CRNN recognition).
#             Requires trained models in ./models/.
#             Train with: training/train.py (YOLO) + training/train_recognizer.py (CRNN)
# "library" : Legacy library-based pipeline (pylibdmtx / zxing-cpp).
#             Kept for backward compatibility; not recommended for new deployments.
scanner:
  mode: "nn"

# --- YOLO detection model (used by both "nn" and optional box-level detection) ---
detection:
  model_path: "./models/datamatrix_yolo.pt"
  model_format: "pt"            # "pt" (PyTorch), "onnx", "ncnn"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 640
  device: "cpu"                 # "cpu" or "0" for first CUDA GPU
  max_detections: 50

# --- CRNN recognition model (used when scanner.mode = "nn") ---
nn_decoding:
  crnn_model_path: "./models/datamatrix_crnn.onnx"
  pad_ratio: 0.05               # fractional padding added around each YOLO crop

database:
  path: "./data/barcodecv.db"
  wal_mode: true

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

calibration:
  known_distance_mm: null
  sweep_distances_mm: [50, 75, 100, 125, 150, 175, 200, 250, 300]
  focus_metric: "laplacian"

box_detection:
  enabled: true
  min_area: 1500          # lower to keep distant/smaller boxes
  max_area: 800000        # allow larger close-up boxes too
  canny_threshold1: 35
  canny_threshold2: 120
  morph_kernel_size: 7    # stronger edge connection for broken / blurry borders
  blur_kernel_size: 5     # Gaussian blur before multi-path contour extraction
  approx_epsilon: 0.02    # polygon approximation precision (fraction of perimeter)
  aspect_ratio_min: 0.5   # use max(w,h)/min(w,h), so box-like rectangles stay near 1
  aspect_ratio_max: 2.4
  square_ratio_max: 1.35  # square-first pass: prioritize near-square candidates for DataMatrix
  square_candidate_limit: 180

spatial_matching:
  overlap_threshold: 0.3  # minimum IoU to count a DataMatrix as inside a box

opencv_datamatrix:
  # Maximum candidate regions for fast (live) mode. Keeps latency under ~3s.
  # Full batch mode uses max_candidates (below) for exhaustive search.
  fast_max_candidates: 35
  min_area: 40
  max_area_ratio: 0.4
  adaptive_block_size: 31
  adaptive_c: 8
  morph_kernel_size: 3
  blur_kernel_size: 5
  aspect_ratio_min: 0.4
  aspect_ratio_max: 2.5
  padding: 16
  max_candidates: 150
  clahe_clip_limit: 3.0
  fallback_full_image: true
  min_output_confidence: 0.45
  supplement_when_mismatch: true  # when decoded count < square box count, run fallback supplement scan
